schema: spec-driven

# Project context shown to AI when creating OpenSpec artifacts.
# Source of truth for the agreed plan: docs/architecture.md
context: |
  Product: Patone — editor/controller for Valeton GP-5 and GP-50 guitar pedals.
  The app talks USB-MIDI to the pedal. Phase 1 uses official MIDI CC only.
  SysEx preset editor, library, and IRs/NAM come in later phases.

  Tech stack:
  - UI: Vite + React + TypeScript + Tailwind + shadcn (from scaffold)
  - Theme: dark default, light optional (shadcn tokens / `dark` class).
    Not a separate change; part of bootstrap-app.
  - Native shell: Tauri 2 (Windows installer now; iOS/Android later)
  - MIDI / link: USB and Bluetooth are asymmetric, not interchangeable.
    USB is one-way and super fast (command out; opportunistic inbound such as
    patch-load dumps may be logged/applied later without becoming duplex).
    Bluetooth is two-way and slower. Pedal Bluetooth uses the official BLE-MIDI
    GATT service (Patone capture); BluetoothLink.send writes encoder bytes
    (CC 0 wrapped as BLE-MIDI). Still a separate backend — not another
    MidiTransport kind of the USB byte pipe.
    - USB-MIDI uses MidiTransport (byte pipe + endpoint discovery, not MIDIPort types)
    - Phase 1 USB-MIDI backends of that USB contract:
      - Browser: Web MIDI (navigator.requestMIDIAccess)
      - Desktop/mobile: Rust midir via Tauri commands/events (WebView2 does not expose Web MIDI)
    - A USB endpoint has id, label, kind usb-midi, optional suggestedModel
    - Bluetooth uses BluetoothLink (discover / open / send / subscribe / close)
      - Browser: Web Bluetooth
      - Desktop: Rust btleplug via Tauri commands (WebView2 does not expose Web Bluetooth)
      - A Bluetooth endpoint has id, label, kind bluetooth, optional suggestedModel
      - subscribe delivers unwrapped MIDI bytes from GATT notify (Log inbound)
    - Connect opens with USB | Bluetooth tabs; the user chooses the method first.
      DeviceSession records linkMode (usb | bluetooth).
      One session for Controller/Editor/Library; features that need pedal→app
      live state or command-out read capabilities (liveFromPedal, commandToPedal)
      instead of forking UI. Patch commandToPedal is true on USB and Bluetooth.
  - Device state: shared TypeScript layer, independent of transport
  - No HTTP backend. The app talks directly to the pedal.
  - Electron is rejected (heavier, worse mobile path).

  Architecture:
  - UI never calls raw MIDI. DeviceSession owns the device model (GP-5 vs GP-50),
    translates actions to CC/SysEx, and the transport only sends/receives bytes.
  - Keep three axes separate: model (GP-5 vs GP-50), protocol (CC now, SysEx later),
    link (USB vs Bluetooth; different capabilities, one DeviceSession).
  - MidiTransport API: discover() -> endpoints; open(id); send(bytes); onMessage; close.
    Do not leak MIDIPort or Web MIDI types above the transport. Phase 1 MIDI endpoints
    are all kind usb-midi. Bluetooth is BluetoothLink (discover/open/send/subscribe/close),
    not a throwing MidiTransport stub. Do not copy reverse-engineered SysEx. Patch recall
    over GATT is in scope (DeviceSession encodes; BluetoothLink.send writes bytes).
    Bluetooth inbound Log is in scope (same Log page, capture only while visible).
  - If Bluetooth later cannot speak CC, the encoder (CC vs SysEx) is the seam —
    same hook the USB editor needs.
  - Single app repo (not a monorepo). OpenSpec lives at the repo root next to src/.
  - Planned layout:
      src/app/                 React shell: layout, routing, theme (dark default)
      src/features/connect     Connection status control + modal (not a page)
      src/features/controller  Phase 1 live controller (home)
      src/features/editor      Phase 2 stub until its change
      src/features/library     Phase 3 stub until its change
      src/device/              models, profiles, official CC maps, session
      src/midi/                MidiTransport (endpoints + bytes), detect (USB web vs tauri), web.ts, tauri.ts
      src/bluetooth/           BluetoothLink (discover/open/send/subscribe/close), detect (web vs tauri), web.ts, tauri.ts
      src-tauri/               Tauri 2 + midir + btleplug

  Device profiles (phase 1, official MIDI CC):
  - GP-5: CC 0 patch, 7 volume, 22–25 bank/patch, 48–57 modules, 58 tuner, 69 CTL
  - GP-50: the above + master/EXP/BPM/Patch|Stomp mode (CC 1, 11, 13, 17, 19, 21, 28)
  - Endpoint suggests model from the USB MIDI name (Valeton usually appears as GP-5 / GP-50).
    If ambiguous or the name does not match, the user confirms or corrects. Port name is not hardware identity.

  Phase 1 visible UI:
  - Shell chrome always visible: Patone name, connection-status control on the left,
    Controller / Editor / Library nav and theme toggle on the right.
  - Controller is the home page (`/`). Connect is global connection state, not a route.
  - Disconnected control label: Connect. Activating it opens a modal with USB
    and Bluetooth tabs (default USB). USB: MIDI permission, endpoints, connect,
    suggested/confirm model, copy as one-way and super fast. Bluetooth: two-way
    and slower; scan/connect GATT; patch previous/select/next over the encoder.
    Connected label and link
    mode are defined in device-connection.
  - Controller: patch 00–99, volume, module toggles NR/PRE/DST/NS/AMP/CAB/EQ/MOD/DLY/RVB, tuner
  - GP-50 also: master volume and Patch/Stomp mode
  - Windows packaging: tauri build → NSIS/MSI
  - Web: Vite in Chrome/Edge (localhost or HTTPS)

  Out of scope until a dedicated change:
  - Mobile Tauri app
  - Preset read/write, rename, reorder
  - IR / SnapTone / NAM upload
  - Applying liveFromPedal inbound to the patch snapshot
  - Volume, modules, tuner over Bluetooth
  Do not copy reverse-engineered SysEx from third-party editors.

  Spec domains for phase 1: midi-transport, device-connection, live-controller.
  Do not specify editor or library until their own changes.

  Planned changes, in order:
  1. bootstrap-app — scaffold Tauri 2 + Vite/React/TS/Tailwind/shadcn, dark default, scripts dev / tauri dev / build
  2. midi-transport — MidiTransport (endpoints + bytes, kind usb-midi) + Web MIDI
     + Rust commands midi_list_ports / open / send + inbound events. No BLE.
  3. device-connection — detect GP-5/GP-50, connect, session state
     (global shell control + modal, not a route)
  4. live-controller — patch, volume, module on/off, tuner via official CC
  5. Later: preset-editor (SysEx), preset-library, IRs/NAM

  Hard constraints:
  - SysEx for editor/IRs is reverse-engineered in third-party projects. Do not copy that code.
  - Phase 1 uses only MIDI CC published in the official manuals.
  - Phase 2 SysEx is documented in its own design.md when that change starts.
  - Spec-driven from day 1: no feature dump without an OpenSpec change
    (/opsx-propose → review → /opsx-apply → /opsx-archive).
  - Code comments and UI/code strings are in English. Chat with the user is in Spanish.
  - Do not run in-browser verification (browser tools, headless Chrome,
    screenshots, click-throughs) unless the user explicitly asks for it.
    Typecheck / lint is fine. The user tests the UI themselves.

rules:
  proposal:
    - Keep proposals focused on one planned change from docs/architecture.md
    - Always include a Non-goals section
    - Cite docs/architecture.md when restating stack, phases, or MIDI constraints
    - Do not propose SysEx copies, preset library, IRs, or mobile packaging in phase 1 changes
    - Connect already offers USB vs Bluetooth tabs and GATT scan/connect; do not revert to USB-only copy or treat the links as interchangeable
  specs:
    - Use WHEN/THEN scenarios (Given/When/Then is fine)
    - Phase 1 capabilities live under midi-transport, device-connection, and live-controller
    - Specs describe observable behavior, not transport-internal byte packing unless that is the capability
    - UI requirements must go through DeviceSession, never raw MIDI from React
  design:
    - Isolate Web MIDI and Tauri/midir behind MidiTransport (endpoints + bytes, kind usb-midi)
    - Do not leak MIDIPort/Web MIDI types into DeviceSession or React
    - Do not leak BluetoothDevice/Web Bluetooth types into DeviceSession or React
    - BluetoothLink is GATT discover/open/send/subscribe/close; do not add a throwing send() stub or copy third-party SysEx
    - Bluetooth inbound Log is in scope; do not apply liveFromPedal inbound to the session snapshot
    - "Links are asymmetric: USB one-way/fast, Bluetooth two-way/slower. DeviceSession records linkMode; later features disable via capabilities (liveFromPedal), they do not fork the UI"
    - DeviceSession owns GP-5 vs GP-50 profiles and official CC maps
    - Do not copy reverse-engineered SysEx from third-party editors
    - Match the agreed repo layout in docs/architecture.md
  tasks:
    - Break work into small, independently verifiable tasks
    - Call out web vs desktop verification where MIDI backends differ
    - Do not add in-browser verification as a required task unless the user
      explicitly asked for browser testing

operations:
  apply:
    guidance:
      - Implement only the current change; leave later-phase features as stubs if the layout requires them
      - Do not introduce HTTP backends, Electron, or a monorepo
      - Do not verify UI in a browser (tools, headless Chrome, screenshots,
        or click-throughs) unless the user explicitly asks. Typecheck / lint
        is enough; the user tests the UI themselves.
  archive:
    guidance:
      - Sync only the phase-1 spec domains that this change actually touched
      - Keep the completion summary concise and note any leftover stubs
